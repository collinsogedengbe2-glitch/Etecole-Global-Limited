    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <section class="contact-section">
        <div class="contact-container">

            <div class="contact-info">
                <h2>Get In Touch</h2>
                <p>
                    Have a question or want to work with us?
                    Send us a message and we'll get back to you.
                </p>

                <p><strong>Email:</strong> etecole6@gmail.com</p>
                <p><strong>Phone:</strong> 08053008943</p>
                <p><strong>Address:</strong> Uti Road, Off PTI Road, Before Army Checkpoint, Effurun, Delta State.</p>
            </div>

            <form id="contactForm" class="contact-form">

                <h2>Contact Us</h2>

                <input
                    type="text"
                    id="name"
                    placeholder="Your Name"
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Your Email"
                >

                <textarea
                    id="message"
                    placeholder="Your Message"
                    rows="6"
                ></textarea>

                <button type="submit">Send Message</button><br><br>
                <a href="./index.html" class="a">Back</a>

                <p id="formMessage"></p>

            </form>

        </div>
    </section>

    <script src="contact.js"></script>
</body>
</html>
